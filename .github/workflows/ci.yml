name: VulnTrack CI/CD & Security Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Least-privilege workflow permissions
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ============================================================================
  # 1. Automated Secret & Static Code Scanning
  # ============================================================================
  security-scanning:
    name: Security & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks Secret Scan
        # Runs the scanner container directly: the hosted action requires a
        # GitProtect licence token that a student repository will not have.
        # gitleaks reads .git through go-git, so the whole history is audited.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w \
            zricethezav/gitleaks:latest \
            detect --source=/w --redact --no-banner --exit-code 1

  # ============================================================================
  # 2. Build & Test Backend (Spring Boot + JUnit 5 + MockMvc)
  # ============================================================================
  test-backend:
    name: Test Backend (Java 17 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Backend Automated Tests & Security Authorization
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test -B

  # ============================================================================
  # 3. Build & Test Frontend (React / TypeScript / Vitest)
  # ============================================================================
  test-frontend:
    name: Test Frontend (Node 20 / React / Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Component Tests
        working-directory: frontend
        run: npm test

      - name: Validate TypeScript Compilation & Production Bundle
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # 4. Container Build, Trivy Image Scanning & GHCR Publishing
  # ============================================================================
  build-and-scan-containers:
    name: Container Build, Trivy Scan & GHCR Publish
    runs-on: ubuntu-latest
    needs: [security-scanning, test-backend, test-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # GHCR refuses uppercase path segments, and github.repository keeps the
      # owner's capitalisation, so the image references are normalised here.
      - name: Resolve GHCR Image References
        id: slug
        run: |
          PREFIX="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${PREFIX}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${PREFIX}/frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ steps.slug.outputs.backend }}:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ steps.slug.outputs.frontend }}:${{ github.sha }}

      # --- DevSecOps gate: fail the pipeline on fixable HIGH / CRITICAL CVEs ---
      - name: Trivy Gate - Backend Image (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ steps.slug.outputs.backend }}:${{ github.sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy Gate - Frontend Image (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ steps.slug.outputs.frontend }}:${{ github.sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # --- Detailed findings reported into the GitHub Security tab (non-blocking) ---
      - name: Trivy SARIF Report - Backend Image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ steps.slug.outputs.backend }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Trivy SARIF Report - Frontend Image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ steps.slug.outputs.frontend }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Backend Trivy Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'backend-trivy'

      - name: Upload Frontend Trivy Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'frontend-trivy'

      # Log in to GitHub Container Registry (only on push to main/master)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish images. Tags are immutable Git SHAs only — never "latest" —
      # so a deployment can always name the exact build it is running.
      - name: Push Backend Image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.slug.outputs.backend }}:${{ github.sha }}

      - name: Push Frontend Image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.slug.outputs.frontend }}:${{ github.sha }}
