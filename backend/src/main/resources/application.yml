server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: vulntrack-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Actuator & Prometheus Configuration for Kubernetes Health Probes & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Application Security Configuration
app:
  security:
    admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:AdminSecurePassword!2026}
    viewer:
      username: ${APP_VIEWER_USERNAME:viewer}
      password: ${APP_VIEWER_PASSWORD:ViewerReadOnlyPassword!2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}
