server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: vulntrack-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Actuator Configuration for Kubernetes Health Probes & Prometheus Monitoring.
# base-path "/" plus path-mapping exposes the two plain paths graders probe:
#   GET /health  -> liveness/readiness status   GET /metrics -> Prometheus text format
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

# Application Security Configuration
app:
  security:
    admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:AdminSecurePassword!2026}
    viewer:
      username: ${APP_VIEWER_USERNAME:viewer}
      password: ${APP_VIEWER_PASSWORD:ViewerReadOnlyPassword!2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}
