# ==============================================================================
# VulnTrack Local Developer Multi-Container Environment
# Orchestrates: PostgreSQL 16 + Spring Boot Backend + React NGINX Frontend
# ==============================================================================

version: '3.8'

services:
  # 1. Relational Database Service
  postgres:
    image: postgres:16-alpine
    container_name: vulntrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulntrack}
      POSTGRES_USER: ${POSTGRES_USER:-vulntrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulntrack_dev_secret_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulntrack_user} -d ${POSTGRES_DB:-vulntrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulntrack-net

  # 2. Spring Boot 3.3 Backend API Service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: vulntrack-backend:local
    container_name: vulntrack-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vulntrack}
      POSTGRES_USER: ${POSTGRES_USER:-vulntrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulntrack_dev_secret_change_me}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-AdminSecurePassword!2026}
      APP_VIEWER_USERNAME: ${APP_VIEWER_USERNAME:-viewer}
      APP_VIEWER_PASSWORD: ${APP_VIEWER_PASSWORD:-ViewerReadOnlyPassword!2026}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80,http://frontend:80"
    ports:
      - "8080:8080"
    networks:
      - vulntrack-net

  # 3. React Single Page Application Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: vulntrack-frontend:local
    container_name: vulntrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - vulntrack-net

volumes:
  postgres_data:
    name: vulntrack_postgres_data

networks:
  vulntrack-net:
    name: vulntrack-network
    driver: bridge
