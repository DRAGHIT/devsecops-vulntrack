server {
    # Unprivileged NGINX may not bind port 80, so the SPA listens on 8080.
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for high-performance asset serving
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse proxy API requests to backend service (Docker Compose network).
    # The upstream lives in a variable so NGINX resolves it at request time;
    # a static hostname would abort startup once the pod has no "backend" DNS
    # record, which is how Kubernetes frontends this SPA through an Ingress.
    location /api/ {
        set $vulntrack_api http://backend:8080;
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass $vulntrack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: forward all client route requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for Nginx container
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
