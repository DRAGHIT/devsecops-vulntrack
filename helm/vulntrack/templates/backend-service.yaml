apiVersion: v1
kind: Service
metadata:
  name: {{ include "vulntrack.fullname" . }}-backend
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "vulntrack.name" . }}
    app.kubernetes.io/component: backend
---
# Alias with the fixed name the frontend image's NGINX config points at
# (http://backend:8080). NGINX resolves a static proxy_pass when it parses its
# config, so without a record by that name the pod would crash-loop on startup.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "vulntrack.name" . }}
    app.kubernetes.io/component: backend
