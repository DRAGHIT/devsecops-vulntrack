apiVersion: v1
kind: Service
metadata:
  name: {{ include "vulntrack.fullname" . }}-frontend
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "vulntrack.name" . }}
    app.kubernetes.io/component: frontend
