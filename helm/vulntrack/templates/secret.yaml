apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulntrack.fullname" . }}-secrets
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  admin-password: "AdminSecurePassword!2026"
  viewer-password: "ViewerReadOnlyPassword!2026"
