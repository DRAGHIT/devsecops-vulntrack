apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulntrack.fullname" . }}-secrets
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  admin-username: {{ .Values.appCredentials.adminUsername | quote }}
  viewer-username: {{ .Values.appCredentials.viewerUsername | quote }}
  admin-password: {{ .Values.appCredentials.adminPassword | quote }}
  viewer-password: {{ .Values.appCredentials.viewerPassword | quote }}
