# ==============================================================================
# VulnTrack Helm Chart Default Values
# Images are published by CI with an immutable Git SHA tag:
#   helm upgrade --install vulntrack ./helm/vulntrack \
#     --namespace vulntrack \
#     --set backend.image.repository=ghcr.io/<owner>/vulntrack/backend \
#     --set backend.image.tag=<commit-sha> \
#     --set frontend.image.repository=ghcr.io/<owner>/vulntrack/frontend \
#     --set frontend.image.tag=<commit-sha>
# ==============================================================================

global:
  environment: local
  namespace: vulntrack

nameOverride: ""
fullnameOverride: ""

# ==============================================================================
# Backend Spring Boot Workload
# ==============================================================================
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/your-github-username/vulntrack/backend
    # Empty falls back to .Chart.AppVersion; CI publishes the commit SHA.
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

  probes:
    liveness:
      path: /health/liveness
      initialDelaySeconds: 40
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /health/readiness
      initialDelaySeconds: 25
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  # Horizontal Pod Autoscaling (HPA)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# ==============================================================================
# Frontend React + NGINX Workload
# ==============================================================================
frontend:
  # Rubric M8: at least two replicas for both application tiers.
  replicaCount: 2
  image:
    repository: ghcr.io/your-github-username/vulntrack/frontend
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    # Cluster-facing port stays 80 so Ingress/rules read naturally.
    port: 80
  # NGINX runs unprivileged inside the image, so it cannot bind port 80.
  containerPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10

# ==============================================================================
# Ingress Controller (NGINX)
# ==============================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: vulntrack.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend

# ==============================================================================
# Application Credentials (read-only demo personas; override with --set)
# ==============================================================================
appCredentials:
  adminUsername: admin
  viewerUsername: viewer
  adminPassword: AdminSecurePassword!2026
  viewerPassword: ViewerReadOnlyPassword!2026

# ==============================================================================
# PostgreSQL Database Deployment
# ==============================================================================
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: vulntrack
    username: vulntrack_user
    # Override at install time for anything beyond a local demo:
    #   --set postgresql.auth.password="$POSTGRES_PASSWORD"
    password: vulntrack_dev_secret_change_me
  # Separate PGDATA keeps initdb out of the lost+found directory that
  # host-path provisioners (kind/minikube) place on the volume root.
  pgData: /var/lib/postgresql/data/pgdata
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ==============================================================================
# Prometheus Scraping Annotations
# ==============================================================================
monitoring:
  enabled: true
  scrape: true
  path: /metrics
  port: 8080
