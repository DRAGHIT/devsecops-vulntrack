# Default container requests/limits for any manifest that forgets to declare them.
apiVersion: v1
kind: LimitRange
metadata:
  name: vulntrack-default-limits
  namespace: vulntrack
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
