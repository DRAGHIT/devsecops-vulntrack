# Least-privilege identity used by both VulnTrack deployments.
# The name is referenced verbatim by the Helm chart templates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulntrack-workload-sa
  namespace: vulntrack
  labels:
    app.kubernetes.io/name: vulntrack
    app.kubernetes.io/managed-by: kubectl
automountServiceAccountToken: false
